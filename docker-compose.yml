services:
  app:
    build: .
    container_name: task-app
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    env_file:
      - configs/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - task-net
    restart: on-failure
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  mysql:
    image: mysql:8.0
    container_name: task-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DB:-task_db}
      MYSQL_USER: ${MYSQL_USER:-task_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-task_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - task-net
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: task-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - task-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Сервис миграций (запускается отдельно через --profile tools)
  migrations:
    image: migrate/migrate
    profiles: ["tools"]
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=mysql://${MYSQL_USER:-task_user}:${MYSQL_PASSWORD:-task_pass}@tcp(mysql:3306)/${MYSQL_DB:-task_db}
      - up
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - task-net

networks:
  task-net:

volumes:
  mysql_data: